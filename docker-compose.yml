name: voxcartes

services:
  web:
    build: .
    image: voxcartes-web:latest
    pull_policy: never
    restart: unless-stopped
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.voxcartes.rule=Path(`/vox`) || PathPrefix(`/vox/`)"
      - "traefik.http.routers.voxcartes.entrypoints=web,websecure"
      - "traefik.http.routers.voxcartes.middlewares=add-slash@file,stripprefix-voxcartes"
      - "traefik.http.middlewares.stripprefix-voxcartes.stripprefix.prefixes=/vox"
      - "traefik.http.services.voxcartes.loadbalancer.server.port=3000"

networks:
  traefik-proxy:
    external: true
